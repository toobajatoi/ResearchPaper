<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780">
  <rect width="920" height="780" fill="#ffffff"/>
  <style>
    .box { fill:#ffffff; stroke:#1a1a1a; stroke-width:1.4; }
    .title { font: 700 15px Georgia, serif; fill:#1a1a1a; }
    .label { font: 13px Georgia, serif; fill:#1a1a1a; }
    .small { font: 12px Georgia, serif; fill:#1a1a1a; }
    .caption { font: 12px Georgia, serif; fill:#333333; }
  </style>
  <text x="40" y="32" class="title">Figure 1. Record flow on 29 September 2026</text>
  <text x="40" y="52" class="caption">Source: screening.csv. Open records are not exclusions and not inclusions.</text>

  <rect x="250" y="70" width="420" height="78" class="box"/>
  <text x="460" y="98" text-anchor="middle" class="label">Records in the screening log after deduplication</text>
  <text x="460" y="122" text-anchor="middle" class="title">2,910</text>

  <line x1="460" y1="148" x2="460" y2="176" stroke="#1a1a1a" stroke-width="1.4"/>

  <rect x="40" y="176" width="200" height="92" class="box"/>
  <text x="140" y="206" text-anchor="middle" class="small">Duplicate marks</text>
  <text x="140" y="226" text-anchor="middle" class="small">inside the log</text>
  <text x="140" y="250" text-anchor="middle" class="title">77</text>

  <rect x="260" y="176" width="200" height="92" class="box"/>
  <text x="360" y="206" text-anchor="middle" class="small">Excluded at title</text>
  <text x="360" y="226" text-anchor="middle" class="small">or abstract</text>
  <text x="360" y="250" text-anchor="middle" class="title">2,669</text>

  <rect x="480" y="176" width="200" height="92" class="box"/>
  <text x="580" y="206" text-anchor="middle" class="small">Reports not</text>
  <text x="580" y="226" text-anchor="middle" class="small">retrieved</text>
  <text x="580" y="250" text-anchor="middle" class="title">22</text>

  <rect x="700" y="176" width="180" height="92" class="box"/>
  <text x="790" y="210" text-anchor="middle" class="small">Full text</text>
  <text x="790" y="230" text-anchor="middle" class="small">read</text>
  <text x="790" y="254" text-anchor="middle" class="title">142</text>

  <line x1="790" y1="268" x2="790" y2="300" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="250" y1="300" x2="790" y2="300" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="250" y1="300" x2="250" y2="320" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="520" y1="300" x2="520" y2="320" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="790" y1="300" x2="790" y2="320" stroke="#1a1a1a" stroke-width="1.4"/>

  <rect x="140" y="320" width="220" height="100" class="box"/>
  <text x="250" y="350" text-anchor="middle" class="small">Excluded at full text</text>
  <text x="250" y="388" text-anchor="middle" class="title">73</text>

  <rect x="400" y="320" width="240" height="100" class="box"/>
  <text x="520" y="348" text-anchor="middle" class="small">HMC papers</text>
  <text x="520" y="370" text-anchor="middle" class="small">excluded at full text</text>
  <text x="520" y="402" text-anchor="middle" class="title">15</text>

  <rect x="680" y="320" width="200" height="100" class="box"/>
  <text x="780" y="350" text-anchor="middle" class="small">Included</text>
  <text x="780" y="388" text-anchor="middle" class="title">69</text>

  <text x="40" y="470" class="label">Check: 77 + 2,669 + 22 + 142 = 2,910. And 73 + 69 = 142.</text>
  <text x="40" y="500" class="label">Source yields before the log was deduplicated</text>
  <text x="40" y="524" class="small">OpenAlex 1,411. PubMed 741 (650 primary, 80 sensitivity, 11 Computers-Are-Social-Actors).</text>
  <text x="40" y="544" class="small">ACL Anthology 614. IEEE Xplore 70. Human-Machine Communication 131.</text>
  <text x="40" y="572" class="small">The ACM Digital Library was not searched. Citation-chase lists were saved and not screened,</text>
  <text x="40" y="592" class="small">except one record kept for full text and counted inside the 63.</text>
  <text x="40" y="630" class="small">Sixty-nine sources are included. Twenty-four of them were included from the recorded PDFs.</text>
  <text x="40" y="650" class="small">Table 2 still charts 17. Those 15 are not in Table 2.</text>
  <text x="40" y="670" class="small">22 reports were not retrieved. The 15 Human-Machine Communication papers were excluded at full text.</text>
</svg>
